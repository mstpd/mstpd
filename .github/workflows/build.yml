name: build mstpd

on: [ push, pull_request ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: install dependencies
      shell: bash
      run: sudo apt -y install libcmocka-dev libmnl-dev clang-tidy bear
    - name: strict build and unit tests
      shell: bash
      run: .devcontainer/scripts/build.sh -t
    - name: lint with clang-tidy
      shell: bash
      run: .devcontainer/scripts/lint.sh
    - name: shellcheck
      shell: bash
      run: shellcheck utils/ifupdown.sh.in utils/mstp_config_bridge.in utils/mstpctl-utils-functions.sh
    - name: distcheck
      shell: bash
      run: ./autogen.sh && ./configure && make distcheck
